Valor',c.value],['Meio de pagamento',c.method],['Criada em',c.date],['Referência do provedor',c.provider],['Próxima etapa',c.next],['Canal','Portal PE']].map(([a,b])=>`<div class="kv"><label>${a}</label><strong>${esc(b)}</strong></div>`).join('')}</div><div class="actions" style="margin-top:24px"><button class="btn secondary" id="refresh">Consultar situação</button><button class="btn secondary" id="history">Copiar identificador</button></div></section><section class="panel"><div class="panelhead"><div><h2>Histórico de eventos</h2><p>Eventos ilustrativos da jornada</p></div></div><div class="timeline"><div class="event"><strong>${c.state==='Pago'?'Pagamento confirmado':'Situação atual: '+esc(c.state)}</strong><p>Retorno registrado no Pagamentos PE · ${esc(c.date)}</p></div><div class="event"><strong>Instruções disponibilizadas ao Portal</strong><p>Referência ${esc(c.provider)} vinculada ao protocolo.</p></div><div class="event"><strong>Cobrança registrada</strong><p>Solicitação recebida com controle de duplicidade.</p></div></div></section></div>`}function servicePage(){return head('Serviços pagos','Serviços com pagamento','Configure quais serviços da Carta de Serviços utilizam o Pagamentos PE.',`<button class="btn" id="new-service">Cadastrar serviço</button>`) + `<div class="notice">A habilitação de um serviço depende da validação da regra de cobrança, do destino da receita e da integração autorizada.</div><section class="panel"><div class="panelhead"><div><h2>Catálogo de serviços configurados</h2><p>Dados ilustrativos para apresentação do MVP.</p></div></div><div class="tablewrap"><table><thead><tr><th>Serviço / código</th><th>Órgão</th><th>Meio</th><th>Integração</th><th>Situação</th><th>Ação</th></tr></thead><tbody>${services.map(s=>`<tr><td><strong>${esc(s.name)}</strong><small>${esc(s.letter)}</small></td><td>${esc(s.org)}</td><td>${esc(s.methods.length?s.methods.join(' · '):'A definir')}</td><td>${esc(s.provider)}</td><td>${badge(s.status)}</td><td><button class="btn ghost" data-service="${s.id}">Visualizar</button></td></tr>`).join('')}</tbody></table></div></section>`}function editPage(){const s=editing;return head('Serviços pagos / '+(s?'Visualização':'Novo cadastro'),s?'Configuração do serviço':'Cadastrar serviço pago','Defina o vínculo com a Carta de Serviços e os parâmetros de cobrança.',`<button class="btn secondary" data-page="services">Voltar ao catálogo</button>`) + `<section class="panel"><div class="steps"><button class="step ${step===0?'active':''}" data-step="0">1 · Identificação</button><button class="step ${step===1?'active':''}" data-step="1">2 · Pagamento</button><button class="step ${step===2?'active':''}" data-step="2">3 · Revisão</button></div><form id="service-form">${step===0?`<div class="formgrid"><div class="field full"><label for="svc">Serviço da Carta de Serviços *</label><input id="svc" required placeholder="Selecione ou informe o serviço" value="${esc(s?.name||'')}"></div><div class="field"><label for="code">Código do serviço *</label><input id="code" required placeholder="Identificador da Carta" value="${esc(s?.letter||'')}"></div><div class="field"><label for="org">Órgão responsável *</label><input id="org" required placeholder="Órgão titular" value="${esc(s?.org||'')}"></div><div class="full formnote">O serviço deve existir na Carta de Serviços. Este cadastro configura somente a cobrança e o retorno do pagamento.</div></div>`:step===1?`<div class="formgrid"><div class="field"><label for="revenue">Código de receita *</label><input id="revenue" placeholder="Validado pela Sefaz" value="${esc(s?.revenue||'')}"></div><div class="field"><label for="value">Regra de valor *</label><select id="value"><option>Valor fixo</option><option ${s?.value.includes('Conforme')?'selected':''}>Valor informado pelo serviço</option></select></div><fieldset class="full payment-options"><legend>Meios de pagamento disponíveis *</legend><p>Selecione todas as opções autorizadas para este serviço.</p><div class="payment-choice">${['Cartão','PIX','Boleto','DAE'].map(m=>`<label><input type="checkbox" name="methods" value="${m}" ${draftMethods.includes(m)?'checked':''}> <span>${m}</span></label>`).join('')}</div><div class="formnote">DAE é o documento de arrecadação. Sua emissão e as formas de quitá-lo dependem das regras e integrações validadas com a Sefaz.</div></fieldset><div class="field"><label for="provider">Integração autorizada *</label><select id="provider"><option>PagBank (proposta)</option><option>Sefaz-PE (a validar)</option></select></div><div class="field"><label for="validity">Validade da cobrança</label><input id="validity" placeholder="Conforme regra do serviço"></div><div class="field"><label for="next">Etapa liberada após confirmação</label><input id="next" value="${esc(s?.next||'')}" placeholder="Ex.: agendamento"></div><div class="full formnote">O PagBank é uma alternativa de integração. A conta recebedora, a receita e a conciliação precisam de validação antes da ativação.</div></div>`:`<div class="formgrid"><div class="kv"><label>Serviço</label><strong>${esc(s?.name||'Novo serviço da Carta')}</strong></div><div class="kv"><label>Órgão</label><strong>${esc(s?.org||'A preencher')}</strong></div><div class="kv"><label>Meio inicial</label><strong>${esc(draftMethods.length?draftMethods.join(' · '):'Nenhum selecionado')}</strong></div><div class="kv"><label>Situação</label><strong>${esc(s?.status||'Rascunho')}</strong></div><div class="full formnote">No protótipo, “Salvar rascunho” demonstra a ação e não persiste dados no servidor. A ativação real requer aprovação das regras de arrecadação e homologação da integração.</div></div>`}<div class="actions" style="margin-top:26px">${step?'<button type="button" class="btn secondary" id="back-step">Voltar</button>':''}${step<2?'<button type="submit" class="btn">Próximo</button>':'<button type="button" class="btn" id="save">Salvar rascunho</button>'}</div></form></section>`}function reconcile(){return head('Conciliação','Conciliação','Identifique diferenças entre cobrança, pagamento e arrecadação.')+`<div class="cards"><div class="card"><div class="label">Itens analisados</div><strong>946</strong><div class="hint">Cenário ilustrativo</div></div><div class="card"><div class="label">Conciliados</div><strong>943</strong><div class="hint">Valores e referências correspondentes</div></div><div class="card"><div class="label">Divergências</div><strong>3</strong><div class="hint">Exigem investigação</div></div><div class="card"><div class="label">Última verificação</div><strong style="font-size:20px">25/11 · 11:00</strong><div class="hint">Dados de demonstração</div></div></div><section class="panel"><div class="panelhead"><div><h2>Pendências de conciliação</h2><p>O pagamento confirmado e a conciliação financeira são verificações distintas.</p></div></div><div class="tablewrap"><table><thead><tr><th>Cobrança</th><th>Ocorrência</th><th>Valor esperado</th><th>Valor informado</th><th>Situação</th><th>Ação</th></tr></thead><tbody><tr><td>PAY-2026-00119</td><td>Referência financeira não localizada</td><td>R$ 89,40</td><td>—</td><td>${badge('Em análise')}</td><td><button class="btn ghost" id="review">Analisar</button></td></tr><tr><td>PAY-2026-00107</td><td>Diferença de valor</td><td>R$ 89,40</td><td>R$ 88,40</td><td>${badge('Em análise')}</td><td><button class="btn ghost" id="review2">Analisar</button></td></tr><tr><td>PAY-2026-00098</td><td>Retorno duplicado</td><td>R$ 89,40</td><td>R$ 89,40</td><td>${badge('Em análise')}</td><td><button class="btn ghost" id="review3">Analisar</button></td></tr></tbody></table></div></section>`}function integration(){return head('Integrações','Integrações','Acompanhe os sistemas utilizados na jornada de pagamento.')+`<div class="grid"><section class="panel"><div class="panelhead"><div><h2>Portal PE</h2><p>Canal consumidor das APIs do Pagamentos PE</p></div>${badge('Operacional')}</div><div class="kv"><label>Papel</label><strong>Solicitar e consultar cobranças; receber confirmação</strong></div><div class="kv"><label>Correlação</label><strong>Protocolo da solicitação ↔ cobrança Pagamentos PE</strong></div></section><section class="panel"><div class="panelhead"><div><h2>PagBank</h2><p>Adaptador proposto para o serviço piloto</p></div>${badge('Em avaliação')}</div><div class="kv"><label>Recursos a validar</label><strong>Pedido, Pix, consulta, webhook e conciliação</strong></div><div class="kv"><label>Condição</label><strong>Arranjo de arrecadação autorizado</strong></div></section></div><section class="panel"><div class="panelhead"><div><h2>Sefaz-PE</h2><p>Regras de receita e confirmação da arrecadação conforme o serviço</p></div>${badge('A validar')}</div><div class="formnote">O protótipo não presume que PagBank e Sefaz compartilham uma API de baixa. A fonte oficial de confirmação e a conciliação serão definidas por receita e pelo contrato do serviço piloto.</div></section>`}function render(){content.innerHTML=({dashboard,charges:chargePage,detail,services:servicePage,edit:editPage,reconcile,integration}[page])();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page||(page==='detail'&&b.dataset.page==='charges')||(page==='edit'&&b.dataset.page==='services')));document.getElementById('sidebar').classList.remove('open')}function go(p){page=p;render();window.scrollTo(0,0)}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='menu'){document.getElementById('sidebar').classList.toggle('open');return}if(b.dataset.page){go(b.dataset.page);return}if(b.dataset.detail){selected=charges.find(c=>c.id===b.dataset.detail);go('detail');return}if(b.dataset.service){editing=services.find(s=>s.id===b.dataset.service);draftMethods=[...editing.methods];step=0;go('edit');return}if(b.id==='new-service'){editing=null;draftMethods=[];step=0;go('edit');return}if(b.dataset.step){if(step===1){draftMethods=[...document.querySelectorAll('input[name=methods]:checked')].map(x=>x.value)}step=Number(b.dataset.step);render();return}if(b.id==='back-step'){if(step===1){draftMethods=[...document.querySelectorAll('input[name=methods]:checked')].map(x=>x.value)}step--;render();return}if(b.id==='apply'){filter=document.getElementById('search').value;stateFilter=document.getElementById('state').value;render();return}if(b.id==='clear'){filter='';stateFilter='Todos';render();return}if(b.id==='refresh')toast('Consulta demonstrativa: nenhum serviço externo foi acionado.');if(b.id==='history'){navigator.clipboard?.writeText(selected.id);toast('Identificador copiado.')}if(b.id==='save')toast('Rascunho demonstrativo. Nenhum dado foi enviado.');if(b.id?.startsWith('review'))toast('Tratamento de divergência previsto para a operação real.');});document.addEventListener('submit',e=>{if(e.target.id==='service-form'){e.preventDefault();if(step===1){draftMethods=[...document.querySelectorAll('input[name=methods]:checked')].map(x=>x.value);if(!draftMethods.length){toast('Selecione ao menos um meio de pagamento.');return}}step=Math.min(2,step+1);render()}});render();
</script></body></html>
